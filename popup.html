<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/popup.css">
</head>

<body>
    <div class="popup-header">
        <button id="themeToggle" class="theme-toggle" title="Toggle Dark Mode">🌙</button>
        <img src="icon.png">
    </div>
    <h2>Coursera Auto</h2>

    <div class="status-box">
        Status: <span id="status">Idle</span>
    </div>

    <!-- Session Stats -->
    <div class="session-stats">
        <div class="stat-item">
            <span class="stat-value" id="videoCount">0</span>
            <span class="stat-label">Videos</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="readingCount">0</span>
            <span class="stat-label">Readings</span>
        </div>
    </div>

    <button id="startBtn">Start Automation ⚡</button>
    <button id="readingBtn">Complete Reading 📖</button>
    <button id="stopBtn">Stop Automation ◼</button>

    <div class="about-section">
        <button id="aboutBtn">About Developer ✪</button>
    </div>

    <div class="disclaimer-banner">
        ⚠️ <strong>For educational purposes only.</strong> This tool is intended to demonstrate browser automation concepts. Please use responsibly.
    </div>

    <div class="footer">
        Use responsibly. Happy learning!
    </div>

    <script src="popup.js"></script>
    <script src="updateChecker.js"></script>
</body>

</html>
