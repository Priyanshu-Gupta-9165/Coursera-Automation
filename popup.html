<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coursera Auto</title>
    <link rel="stylesheet" href="styles/popup.css">
    <link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/clementfive" type="text/css"/>

</head>
<body>
    <main class="app-container">

        <!-- ═══ 1. HERO — ONE SINGLE IMAGE (logo + title + tagline baked in) ═══ -->
        <section class="hero">
            <img class="hero-image"
                 src="icons and image/logo_coursera_blue.jpeg"
                 alt="Coursera Auto — Smarter Browser Automation"
                 draggable="false">
        </section>

        <!-- ═══ 2. STATUS CARD ═══ -->
        <section class="status-card">
            <div class="status-half" id="systemStatusCol">
                <div class="status-icon-box">
                    <img src="icons and image/icon_status_sign.png" alt="" class="status-icon" draggable="false">
                </div>
                <div class="status-text">
                    <span class="status-label">SYSTEM STATUS</span>
                    <span class="status-value" id="systemStatus" aria-live="polite">
                        <span class="status-dot dot-idle" id="statusDot"></span>
                        <span id="statusLabelText">Idle</span>
                    </span>
                </div>
            </div>
            <div class="status-divider"></div>
            <div class="status-half" id="workerStatusCol">
                <div class="status-icon-box">
                    <img src="icons and image/icon_sloth.svg" alt="" class="status-icon" id="workerIcon" draggable="false">
                </div>
                <div class="status-text">
                    <span class="status-label">WORKER</span>
                    <span class="status-value" id="workerStatus" aria-live="polite">
                        <span class="status-dot dot-inactive" id="workerDot"></span>
                        <span id="workerLabelText">Inactive</span>
                    </span>
                </div>
            </div>
        </section>

        <!-- ═══ 3. STATS GRID ═══ -->
        <section class="stats-grid">

            <!-- Videos Completed Counter -->
            <article class="stat-card card-warm">
                <div class="stat-top">
                    <div class="stat-icon-box icon-warm">
                        <img src="icons and image/icon_video_camera.svg" alt="" class="stat-icon-img" draggable="false">
                    </div>
                    <div class="stat-labels">
                        <span class="stat-micro">VIDEOS  COMPLETED</span>
                    </div>
                </div>
                <div class="video-counter-value" id="videosCompletedVal" aria-live="polite">0</div>
                <div class="video-pill" id="videoIndicator">
                    <span class="status-dot dot-session"></span>
                    <span id="videoStatusLabel">Auto Skipped & Done</span>
                </div>
            </article>

            <!-- Time Spent -->
            <article class="stat-card card-cool">
                <div class="stat-top">
                    <div class="stat-icon-box icon-cool">
                        <img src="icons and image/icon_stopwatch.svg" alt="" class="stat-icon-img" draggable="false">
                    </div>
                    <div class="stat-labels">
                        <span class="stat-micro">TIME SPENT</span>
                    </div>
                </div>
                <div class="timer-value" id="timerVal" aria-live="polite">00:08:34</div>
                <div class="session-pill" id="sessionIndicator">
                    <span class="status-dot dot-session"></span>
                    <span id="sessionLabel">Active Session</span>
                </div>
            </article>
        </section>

        <!-- ═══ 4. CTA — START / MODE / STOP ═══ -->
        <div class="cta-zone">
            <!-- Start -->
            <button class="cta-btn cta-start" id="startBtn" type="button">
                <div class="cta-icon-wrap">
                    <img src="icons and image/icon_gears.svg" alt="" class="cta-gear" draggable="false">
                </div>
                <div class="cta-copy">
                    <span class="cta-title">Start Automation</span>
                    <span class="cta-sub">Start smart learning automation</span>
                </div>
                <div class="cta-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </div>
            </button>

            <!-- Mode Select -->
            <div class="mode-row" id="modeButtons" style="display:none">
                <button class="mode-btn" id="videoBtn" type="button">
                    <img src="icons and image/icon_video_camera.svg" alt="" class="mode-icon" draggable="false">
                    <span>Video</span>
                </button>
                <button class="mode-btn" id="readingBtn" type="button">
                    <img src="icons and image/icon_books.svg" alt="" class="mode-icon" draggable="false">
                    <span>Reading</span>
                </button>
            </div>

            <!-- Stop -->
            <button class="cta-btn cta-stop" id="stopBtn" type="button" style="display:none">
                <div class="cta-icon-wrap cta-icon-stop">
                    <img src="icons and image/icon_gears.svg" alt="" class="cta-gear gear-spin" draggable="false">
                </div>
                <div class="cta-copy">
                    <span class="cta-title cta-title-red">Stop Automation</span>
                    <span class="cta-sub cta-sub-red">Automation is running…</span>
                </div>
                <div class="cta-arrow cta-arrow-red">
                    <svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </div>
            </button>
        </div>

        <!-- ═══ 5. WARNING ═══ -->
        <section class="warning-card">
            <div class="warning-icon-wrap">
                <img src="icons and image/icon_warning.svg" alt="" class="warning-icon" draggable="false">
            </div>
            <div class="warning-copy">
                <p class="warning-title">For Educational purpose only.</p>
                <p class="warning-body">This tool is intended to demonstrate browser automation concepts. Please use responsibly.</p>
            </div>
        </section>

        <!-- ═══ 6. ABOUT DEVELOPER ═══ -->
        <button class="developer-card" id="aboutBtn" type="button">
            <div class="dev-icon-wrap">
                <img src="icons and image/icon_developer.svg" alt="" class="dev-icon" draggable="false">
            </div>
            <div class="dev-copy">
                <span class="dev-title">About Developer</span>
                <span class="dev-sub">Know more about the creator of this tool</span>
            </div>
            <div class="dev-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
        </button>

        <!-- ═══ 7. FOOTER ═══ -->
        <footer class="app-footer">
            <img src="icons and image/icon_shield_check.svg" alt="" class="footer-shield" draggable="false">
            <span>Use responsibly. Happy Learning!</span>
        </footer>

    </main>

    <script src="popup.js"></script>
    <script src="updateChecker.js"></script>
</body>
</html>
